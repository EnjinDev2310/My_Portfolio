schema: spec-driven

context: |
  Tech stack: Angular 21, SSR, TailwindCSS 4, Vitest, TypeScript
  Architecture: Standalone components, signal-based state, services with DI
  Testing: Vitest via @angular/build:unit-test, Playwright for E2E
  Style: TailwindCSS utility classes, standalone components

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
    tdd: false
    test_command: "bun test"
  verify:
    test_command: "bun test"
    build_command: "bun run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
